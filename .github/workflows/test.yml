name: Tests
on:
  pull_request:
  push:
    paths:
      - '**.py'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'dashboard.html'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/dashboard.test.cjs
