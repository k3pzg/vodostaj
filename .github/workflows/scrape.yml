name: Scrape vodostaj i protok
run-name: Scrape vodostaj i protok (${{ github.sha }})

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping scraper runs. Other actors may still update main while a
# run is in progress, so the push step below also rebases and retries.
concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: |
          attempt=1
          max_attempts=3

          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "Scraper attempt $attempt/$max_attempts"
            if python scraper.py; then
              echo "Scraper succeeded on attempt $attempt"
              exit 0
            fi

            echo "Scraper failed on attempt $attempt"

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Waiting 60 seconds before retry..."
              sleep 60
            fi

            attempt=$((attempt + 1))
          done

          echo "Scraper failed after $max_attempts attempts"
          exit 1

      - name: Commit and push if changed
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vodostaj_protok.csv

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update vodostaj_protok.csv"

          # main may have moved while the scraper was running (for example a
          # manual/Codex commit). Rebase our CSV commit onto the latest main.
          # Retry because main can theoretically move again between rebase and push.
          max_push_attempts=5
          for attempt in $(seq 1 "$max_push_attempts"); do
            echo "Push attempt $attempt/$max_push_attempts"

            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"

            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Push succeeded."
              exit 0
            fi

            if [ "$attempt" -lt "$max_push_attempts" ]; then
              echo "Remote moved again; retrying..."
              sleep 2
            fi
          done

          echo "Push failed after $max_push_attempts attempts."
          exit 1
