name: Scrape vodostaj i protok

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Do not let two runs update the CSV from the same parent commit. Without this,
# the slower run is rejected by GitHub with exit code 128 when it tries to push.
concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: |
          attempt=1
          max_attempts=3

          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "Scraper attempt $attempt/$max_attempts"
            if python scraper.py; then
              echo "Scraper succeeded on attempt $attempt"
              exit 0
            fi

            echo "Scraper failed on attempt $attempt"

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Waiting 60 seconds before retry..."
              sleep 60
            fi

            attempt=$((attempt + 1))
          done

          echo "Scraper failed after $max_attempts attempts"
          exit 1

      - name: Commit and push if changed
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vodostaj_protok.csv

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update vodostaj_protok.csv"
          git push origin "HEAD:${TARGET_BRANCH}"
