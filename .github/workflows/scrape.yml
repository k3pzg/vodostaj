name: Scrape vodostaj i protok
run-name: Scrape vodostaj i protok (${{ github.sha }})

on:
  push:
    branches: [main]
    paths:
      - 'scraper.py'
      - 'rating_curve.py'
      - 'merge_csv.py'
      - 'requirements.txt'
      - '.github/workflows/scrape.yml'
  schedule:
    - cron: "7 * * * *"
  # Optional external scheduler; GitHub schedule is best effort.
  repository_dispatch:
    types: [scrape]
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping scraper runs. Other actors may still update main while a
# run is in progress, so the push step below also rebases and retries.
concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run scraper
        id: collect
        run: |
          attempt=1
          max_attempts=3

          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "Scraper attempt $attempt/$max_attempts"
            status=0
            python scraper.py --report collection-report.json --status-file scrape-status.json --snapshot-dir source-snapshots || status=$?
            if [ "$status" -eq 0 ] || [ "$status" -eq 2 ]; then
              echo "quality_status=$status" >> "$GITHUB_OUTPUT"
              echo "Collection completed; quality status: $status"
              exit 0
            fi

            echo "Scraper failed on attempt $attempt"

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Waiting 60 seconds before retry..."
              sleep 60
            fi

            attempt=$((attempt + 1))
          done

          echo "Scraper failed after $max_attempts attempts"
          echo "quality_status=1" >> "$GITHUB_OUTPUT"
          # Publish failure status before marking the job as failed.
          exit 0

      - name: Commit and push if changed
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vodostaj_protok.csv
          if [ -f flow-estimates.json ]; then git add flow-estimates.json; fi
          if [ -f scrape-status.json ]; then git add scrape-status.json; fi

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update measurements and collection status"
          cp vodostaj_protok.csv "$RUNNER_TEMP/collected.csv"
          if [ -f scrape-status.json ]; then cp scrape-status.json "$RUNNER_TEMP/collected-status.json"; fi

          # main may have moved while the scraper was running (for example a
          # manual/Codex commit). Rebase our CSV commit onto the latest main.
          # Retry because main can theoretically move again between rebase and push.
          max_push_attempts=5
          for attempt in $(seq 1 "$max_push_attempts"); do
            echo "Push attempt $attempt/$max_push_attempts"

            git fetch origin "$TARGET_BRANCH"
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort
              # Only our generated files are replaced; preserve concurrent code changes.
              git reset --hard "origin/$TARGET_BRANCH"
              python merge_csv.py vodostaj_protok.csv "$RUNNER_TEMP/collected.csv" --estimates-file flow-estimates.json
              if [ -f "$RUNNER_TEMP/collected-status.json" ]; then
                cp "$RUNNER_TEMP/collected-status.json" scrape-status.json
              fi
              git add vodostaj_protok.csv scrape-status.json flow-estimates.json
              if ! git diff --cached --quiet; then
                git commit -m "Update measurements and collection status"
              fi
            fi

            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Push succeeded."
              exit 0
            fi

            if [ "$attempt" -lt "$max_push_attempts" ]; then
              echo "Remote moved again; retrying..."
              sleep 2
            fi
          done

          echo "Push failed after $max_push_attempts attempts."
          exit 1

      # Run after committing valid observations: gaps must not prevent saving them.
      - name: Check data quality
        if: always() && steps.collect.outcome == 'success'
        env:
          COLLECTION_QUALITY: ${{ steps.collect.outputs.quality_status }}
        run: |
          if [ "$COLLECTION_QUALITY" = "1" ]; then
            echo "::error::Collection failed. Existing measurements were preserved where possible; see collection-report.json."
            exit 1
          fi
          # Exit 2 means incomplete historical/source coverage (degraded), not
          # a broken collection job. Keep reporting gaps without failing Actions.
          check_status=0
          python scraper.py --check --report quality-report.json || check_status=$?

          if [ "$check_status" -ne 0 ] && [ "$check_status" -ne 2 ]; then
            echo "::error::Data quality check failed (exit $check_status)."
            exit "$check_status"
          fi

          if [ "$check_status" -eq 2 ] || [ "$COLLECTION_QUALITY" = "2" ]; then
            echo "::warning::Delayed/unavailable source or incomplete measurement coverage; see quality-report.json and collection-report.json."
          elif [ "$COLLECTION_QUALITY" != "0" ]; then
            echo "::error::Unexpected collection quality status: $COLLECTION_QUALITY"
            exit 1
          fi

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrape-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            collection-report.json
            quality-report.json
            scrape-status.json
            flow-estimates.json
            source-snapshots/
          if-no-files-found: ignore
          retention-days: 30
